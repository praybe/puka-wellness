<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUKA — 곧 만나요 🐻</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #F9C8D4; --pink-deep: #F2A0B8; --pink-glow: #FFE4EE;
      --white: #FFFBFD; --text: #2A1A20; --text-soft: #7A5060; --accent: #E8557A;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    #glitter-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .blob-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; animation: drift 12s ease-in-out infinite alternate; }
    .blob-1 { width: 500px; height: 500px; background: var(--pink); top: -100px; left: -100px; animation-duration: 14s; }
    .blob-2 { width: 400px; height: 400px; background: var(--pink-deep); bottom: -80px; right: -80px; animation-duration: 10s; animation-delay: -4s; }
    .blob-3 { width: 300px; height: 300px; background: var(--pink-glow); top: 40%; left: 50%; animation-duration: 18s; animation-delay: -7s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }
    .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px 80px; text-align: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(52px,10vw,96px); font-weight: 700; letter-spacing: 0.12em; color: var(--text); line-height: 1; position: relative; display: inline-block; animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both; }
    .logo::after { content: ''; display: block; height: 4px; background: linear-gradient(90deg, var(--pink-deep), var(--accent)); border-radius: 2px; margin-top: 8px; transform: scaleX(0); animation: lineIn 0.7s 0.6s cubic-bezier(.22,1,.36,1) forwards; transform-origin: left; }
    @keyframes lineIn { to { transform: scaleX(1); } }
    .bears { font-size: 28px; margin: 20px 0 8px; animation: fadeUp 0.9s 0.15s cubic-bezier(.22,1,.36,1) both; letter-spacing: 6px; }
    .headline { font-family: 'Playfair Display', serif; font-size: clamp(20px,4vw,34px); font-weight: 400; line-height: 1.5; max-width: 560px; margin: 16px auto 12px; animation: fadeUp 0.9s 0.25s cubic-bezier(.22,1,.36,1) both; }
    .headline em { font-style: italic; color: var(--accent); }
    .sub { font-size: 15px; color: var(--text-soft); max-width: 400px; line-height: 1.7; margin: 0 auto 40px; animation: fadeUp 0.9s 0.35s cubic-bezier(.22,1,.36,1) both; }
    .form-wrap { width: 100%; max-width: 420px; animation: fadeUp 0.9s 0.45s cubic-bezier(.22,1,.36,1) both; }
    .input-row { display: flex; gap: 10px; background: rgba(255,255,255,0.75); border: 1.5px solid var(--pink-deep); border-radius: 100px; padding: 6px 6px 6px 22px; backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(242,160,184,0.25); transition: box-shadow 0.3s, border-color 0.3s; }
    .input-row:focus-within { box-shadow: 0 6px 32px rgba(232,85,122,0.3); border-color: var(--accent); }
    .input-row input { flex: 1; border: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; }
    .input-row input::placeholder { color: #C09AA8; }
    .btn { background: linear-gradient(135deg, var(--pink-deep), var(--accent)); color: #fff; border: none; border-radius: 100px; padding: 12px 24px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(232,85,122,0.35); }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,85,122,0.45); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .disclaimer { font-size: 12px; color: var(--text-soft); margin-top: 14px; animation: fadeUp 0.9s 0.55s cubic-bezier(.22,1,.36,1) both; }
    .success-msg { display: none; flex-direction: column; align-items: center; gap: 8px; animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both; }
    .success-msg .check { font-size: 36px; }
    .success-msg p { font-size: 15px; color: var(--text-soft); }
    .success-msg strong { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); }
    .error-msg { font-size: 12px; color: var(--accent); margin-top: 8px; display: none; }
    .x-link { margin-top: 48px; animation: fadeUp 0.9s 0.65s cubic-bezier(.22,1,.36,1) both; }
    .x-link a { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); text-decoration: none; border: 1px solid var(--pink-deep); border-radius: 100px; padding: 8px 18px; transition: background 0.2s, color 0.2s; }
    .x-link a:hover { background: var(--pink-glow); color: var(--text); }
    .x-link a svg { width: 14px; height: 14px; fill: currentColor; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .float-bear { position: fixed; font-size: 22px; pointer-events: none; animation: floatUp linear forwards; z-index: 0; }
    @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 10% { opacity: 1; } 90% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-100vh) rotate(20deg); } }
  </style>
</head>
<body>
<canvas id="glitter-canvas"></canvas>
<div class="blob-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="wrapper">
  <div class="logo">PUKA</div>
  <div class="bears">🐻🐻🐻</div>
  <h1 class="headline">
    맛있게 먹으면서<br><em>몸도 챙길 수 있다면?</em>
  </h1>
  <p class="sub">
    50가지 이상의 영양성분을 담은 젤리, 곧 출시해요.<br>
    이메일 등록하면 제일 먼저 알려드릴게요 🐻
  </p>
  <div class="form-wrap">
    <div id="form-area">
      <div class="input-row">
        <input type="email" id="email-input" placeholder="이메일 주소를 입력해주세요" />
        <button class="btn" id="submit-btn" onclick="handleSubmit()">출시 알림 받기 ✨</button>
      </div>
      <p class="error-msg" id="error-msg">올바른 이메일 주소를 입력해주세요</p>
    </div>
    <div class="success-msg" id="success-area">
      <span class="check">🎀</span>
      <strong>등록되었어요!</strong>
      <p>출시 소식, 제일 먼저 전해드릴게요 🐻</p>
    </div>
    <p class="disclaimer">출시 소식 전달 외 다른 용도로 사용하지 않아요</p>
  </div>
  <div class="x-link">
    <a href="https://x.com/PUKAwellness" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.629zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      @PUKAwellness
    </a>
  </div>
</div>
<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMN_Phdh2TCNIgz3AOMa7oyRuaWs7ao0Al-sQls5gbADYL4h27IdvxXRxlAp3makgS/exec';

  // ── GLITTER ──
  const canvas = document.getElementById('glitter-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function spawnParticle() { particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2.5+0.5, alpha: Math.random(), speed: Math.random()*0.008+0.003, phase: Math.random()*Math.PI*2, hue: Math.random()*30+340 }); }
  for (let i = 0; i < 80; i++) spawnParticle();
  function drawGlitter() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.phase += p.speed; const a = (Math.sin(p.phase)+1)/2*0.7; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = `hsla(${p.hue},80%,75%,${a})`; ctx.fill(); }); requestAnimationFrame(drawGlitter); }
  requestAnimationFrame(drawGlitter);

  // ── FLOATING BEARS ──
  function spawnBear() { const el = document.createElement('div'); el.className = 'float-bear'; el.textContent = '🐻'; el.style.left = Math.random()*100+'vw'; el.style.bottom = '-40px'; const dur = Math.random()*8+10; el.style.animationDuration = dur+'s'; document.body.appendChild(el); setTimeout(() => el.remove(), dur*1000); }
  setInterval(spawnBear, 2800);

  // ── FORM ──
  async function handleSubmit() {
    const val = document.getElementById('email-input').value.trim();
    const errorMsg = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');
    if (!val || !val.includes('@') || !val.includes('.')) {
      errorMsg.style.display = 'block';
      document.querySelector('.input-row').style.borderColor = 'var(--accent)';
      return;
    }
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '등록 중...';
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: val })
      });
    } catch(e) { console.log(e); }
    document.getElementById('form-area').style.display = 'none';
    const success = document.getElementById('success-area');
    success.style.display = 'flex';
  }

  document.getElementById('email-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
</script>
</body>
</html>
